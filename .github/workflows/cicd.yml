
name: First CI CD YAML Hands-ons

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Get the code from GitHub
        uses: actions/checkout@v4

      - name: Print execution logs
        run: echo "Testing code OK"

      - name: Build Maven Project
        run: mvn clean install -DskipTests=true

      - name: Build Docker Image
        run: docker build -t mugibro/cicdworkflows:latest .

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker image push
        run: docker push  mugibro/cicdworkflows:latest

  deploy:
    needs: build
    name: delevery check
    runs-on: ubuntu-latest

    steps:
      - name: print the code
        run: echo "Testing deleivery chhelc a"

      - name: server ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_IP}}
          username:  ubuntu
          key:  ${{ secrets.AWS_EC2_KEY}}
          port: 22
          script: |
            
            echo "Connected to EC2"
            
            sudo docker pull mugibro/cicdworkflows:latest
            
            sudo docker stop my-springboot-app || true
            
            sudo docker rm my-springboot-app || true
            
            sudo docker run -d \ --name my-springboot-app \-p 8080:8080 \mugibro/cicdworkflows:latest




