
name: First CI CD YAML Hands-ons

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Get the code from GitHub
        uses: actions/checkout@v4

      - name: Print execution logs
        run: echo "Testing code OK"

      - name: Build Maven Project
        run: mvn clean install -DskipTests=true

      - name: Build Docker Image
        run: docker build -t mugibro/cicdworkflows:latest .

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker image push
        run: docker push  mugibro/cicdworkflows:latest

